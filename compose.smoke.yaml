# CI-only overlay: real production mounts, synthetic adapters, no network.
services:
  mailhelp:
    network_mode: none
    entrypoint: [python, -m, pytest]
    command: ["-q", "--no-cov", "-p", "no:cacheprovider", "/tests/test_container_runtime.py"]
    environment:
      MAILHELP_SMOKE_CONFIG: /config
    volumes:
      - ./tests:/tests:ro
