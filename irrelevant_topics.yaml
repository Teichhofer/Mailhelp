topics:
- id: social-media-benachrichtigungen
  name: Social-Media-Benachrichtigungen
  enabled: true
  description: Automatisch generierte Benachrichtigungen sozialer Netzwerke über Aktivitäten
    von Kontakten, gefolgten Seiten oder Gruppen.
  examples:
  - Eine gefolgte Seite hat ein neues Foto geteilt
  - Ein Kontakt hat auf deiner Pinnwand gepostet
  exclusions: []
- id: konto-sicherheit-und-authentifizierung
  name: Konto-Sicherheit und Authentifizierung
  enabled: true
  description: Sicherheitsbenachrichtigungen zu Anmeldungen auf neuen Geräten, App-Passwörtern,
    Zwei-Faktor-Codes und E-Mail-Verifizierung.
  examples:
  - Neue Anmeldung auf unbekanntem Gerät erkannt
  - Bitte bestätigen Sie Ihre E-Mail-Adresse
  exclusions: []
- id: werbe-newsletter-mit-rabattaktionen
  name: Werbe-Newsletter mit Rabattaktionen
  enabled: true
  description: Promotionale E-Mails von Online-Shops mit zeitlich begrenzten Rabattcodes,
    Gutscheinen und Produktangeboten.
  examples:
  - 'Nur heute: 20% Rabattcode auf das gesamte Sortiment'
  - Saisonaler Sale mit Gutscheincode im Newsletter
  exclusions: []
- id: gesundheits-und-nahrungserganzungswerbung
  name: Gesundheits- und Nahrungsergänzungswerbung
  enabled: true
  description: Marketing für Nahrungsergänzungsmittel, Superfoods, Vitalpilze und
    Online-Apothekendienste mit gesundheitsbezogenen Versprechen.
  examples:
  - Pilz-Extrakte für Immunsystem und Energie
  - Online-Apotheke mit Rabatt auf Gesundheitsprodukte
  exclusions: []
- id: headshop-und-growshop-werbung
  name: Headshop- und Growshop-Werbung
  enabled: true
  description: Werbe-Newsletter für Cannabis-Samen, Pilzzucht, Rauchzubehör und zugehörige
    Ratgeber sowie Dosierungstools.
  examples:
  - 40% auf alle Samen nur bis Sonntag
  - Anleitung zum Pilzanbau mit Flüssigkultur
  exclusions: []
- id: paket-und-versandbenachrichtigungen
  name: Paket- und Versandbenachrichtigungen
  enabled: true
  description: Automatische Zustellungsankündigungen, Sendungsverfolgung und Zustelloptionen
    von Paketdienstleistern.
  examples:
  - Ihr Paket kommt heute zwischen 14 und 16 Uhr
  - Paket live verfolgen oder Abstell-Okay erteilen
  exclusions: []
- id: veranstaltungs-und-seminarankundigungen
  name: Veranstaltungs- und Seminarankündigungen
  enabled: true
  description: Einladungen und Ankündigungen zu Veranstaltungen, Festen, Webinaren,
    Messen und Fortbildungsseminaren.
  examples:
  - Einladung zu einem virtuellen Branchenfestival
  - Seminar zur Altersvorsorge im November
  exclusions: []
- id: fach-und-branchen-newsletter
  name: Fach- und Branchen-Newsletter
  enabled: true
  description: Redaktionelle Newsletter für berufliche Zielgruppen mit Fachartikeln,
    Verbandsnachrichten und Branchenmeldungen.
  examples:
  - Wöchentlicher Agrar-Newsletter mit Meldungen zur Tierhaltung
  - Newsletter mit KI-Weiterbildungsangeboten
  exclusions: []
- id: dating-und-erwachsenenplattform-benachrichtigungen
  name: Dating- und Erwachsenenplattform-Benachrichtigungen
  enabled: true
  description: Benachrichtigungen von Dating-Plattformen und Creator-/Fan-Plattformen
    über angebliche Nachrichten oder Inhalte, teils mit Spam-Verdacht.
  examples:
  - Neue Nachricht von einem Mitglied auf einer Dating-Plattform
  - Exklusives Video-Angebot eines Creators
  exclusions: []
- id: reise-und-tourismus-werbung
  name: Reise- und Tourismus-Werbung
  enabled: true
  description: Marketing-E-Mails von Reiseanbietern mit Rabatten auf Flüge, Hotels
    und Mitgliedschaftsvorteilen.
  examples:
  - Spare 20% auf deine nächste Hotelbuchung
  - Exklusive Flugdeals für Abonnenten
  exclusions: []
- id: system-und-statusbenachrichtigungen
  name: System- und Statusbenachrichtigungen
  enabled: true
  description: Automatische Dienstmails zu Wartungen, Statusänderungen oder technischen
    Ereignissen, meist mit No-Reply-Absender.
  examples:
  - Geplante Serverwartung mit Zeitfenster
  - Statusseiten-Benachrichtigung über ein Update
  exclusions: []
- id: umfragen-und-feedback-anfragen
  name: Umfragen und Feedback-Anfragen
  enabled: true
  description: Einladungen zur Teilnahme an Umfragen oder Leserbefragungen, teilweise
    mit Werbeangebot als Anreiz.
  examples:
  - Leserumfrage zum Ausgang einer Parlamentswahl
  - Kurze Bewertung des Newsletters mit Klick auf eine Skala
  exclusions: []
- id: bestell-und-transaktionsbestatigungen
  name: Bestell- und Transaktionsbestätigungen
  enabled: true
  description: Automatische Bestell- und Versandbestätigungen von Online-Händlern
    mit Bestellreferenz und Widerrufshinweisen.
  examples:
  - Dein Paket wurde versendet – voraussichtliche Ankunft morgen
  - Bestellbestätigung mit Artikelliste und Widerrufsbelehrung
  exclusions: []
