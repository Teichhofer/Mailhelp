topics:
- id: wohnung
  name: Wohnung
  enabled: true
  description: Nachrichten zum eigenen Mietverhältnis und zur Hausverwaltung.
  examples:
  - Betriebskostenabrechnung
  - Wartungstermin
  exclusions:
  - Immobilienwerbung
- id: gemeinderat
  name: Gemeinderat
  enabled: true
  description: Nachrichten zur Arbeit des Gemeinderats, seinen Sitzungen und kommunalpolitischen
    Themen.
  examples:
  - Sitzungseinladung
  - Tagesordnung
  - Beschlussvorlage
  exclusions:
  - Allgemeine Parteienwerbung ohne Bezug zum Gemeinderat
- id: landfrauen
  name: Landfrauen
  enabled: true
  description: Nachrichten zum Landfrauenverein, seinen Veranstaltungen und Vereinsaktivitäten.
  examples:
  - Veranstaltungseinladung
  - Vereinsversammlung
  - Kursangebot
  exclusions:
  - Allgemeine Werbung ohne Bezug zum Landfrauenverein
- id: auslaenderbehoerde
  name: Ausländerbehörde
  enabled: true
  description: Nachrichten der Ausländerbehörde zu Aufenthalt, Einbürgerung und behördlichen
    Terminen.
  examples:
  - Terminbestätigung
  - Aufenthaltstitel
  - Unterlagenanforderung
  exclusions:
  - Allgemeine Reise- und Tourismuswerbung
- id: kommunalverwaltung-und-sitzungsinformationen
  name: Kommunalverwaltung und Sitzungsinformationen
  enabled: true
  description: Informationsmails der Gemeindeverwaltung zu Ratsvorlagen und Tagesordnungspunkten,
    Personalentscheidungen sowie Befragungen zu kommunalen Einrichtungen.
  examples:
  - Neu eingestellte Sitzungsvorlagen im Ratsinformationssystem
  - Zusätzliche Tagesordnungspunkte für Gemeinderatssitzung
  - Bewerbervorstellung für eine Leitungsstelle
  - Elternbefragung zu städtischen Kindertageseinrichtungen
  exclusions: []
- id: termin-und-meeting-koordination
  name: Termin- und Meeting-Koordination
  enabled: true
  description: E-Mails zur Vereinbarung, Verschiebung oder Durchführung von Treffen
    inklusive Zugangsdaten für Online-Konferenzen.
  examples:
  - Meeting wird auf einen späteren Tag verschoben
  - Zugangsdaten für ein Videomeeting
  exclusions: []
- id: personlicher-smalltalk-private-korrespondenz
  name: Persönlicher Smalltalk & private Korrespondenz
  enabled: true
  description: Lockere private Nachrichten über Hobbys, Serien, Musik, Schule und
    Alltagsfragen sowie kurze persönliche Zwischenmeldungen.
  examples:
  - Frage nach der Lieblingsserie oder dem Lieblingsbuch
  - Kurze private Rückmeldung wie 'Alles gut' innerhalb eines Gesprächs
  exclusions: []
- id: vereins-verbands-organisationskommunikation
  name: Vereins-, Verbands- & Organisationskommunikation
  enabled: true
  description: 'Organisatorische Korrespondenz rund um Vereine und Verbände: Presseartikel-Einreichungen,
    Vorstandsarbeit, Einladungen, Petitionen und interne Kurznotizen.'
  examples:
  - Vereinsbericht mit Foto an die Lokalredaktion eingereicht
  - Newsletter einer Petitionsplattform mit Aufruf zum Unterzeichnen
  exclusions: []
- id: serviceauftrage-reparaturanfragen
  name: Serviceaufträge & Reparaturanfragen
  enabled: true
  description: Übermittlung von Wartungs- und Instandsetzungsaufträgen, teils als
    dringende Reparaturanfrage einzelner Bauteile.
  examples:
  - Ausgefülltes Serviceauftragsformular im Anhang
  - Eilige Reparaturanfrage für die Drosselklappe eines Fahrzeugs
  exclusions: []
- id: veranstaltungen-fortbildungen-anmeldungen
  name: Veranstaltungen, Fortbildungen und eigene Anmeldungen
  enabled: true
  description: Anmelde- und Buchungsbestätigungen sowie Einladungen zu Fachvorträgen,
    Webinaren, Online-Vorträgen, Seminaren, Schulungen und Fortbildungen, etwa vom
    Landwirtschaftsamt, von Behörden, Kammern oder Verbänden, einschließlich Zugangslinks,
    Terminänderungen und Absagen dazu.
  examples:
  - Anmeldebestätigung für einen Onlinevortrag des Landwirtschaftsamts mit Beginn und Ende
  - Aufforderung, eine Seminarbuchung per Link zu bestätigen
  - Zugangslink zu einem gebuchten Webinar
  exclusions:
  - Reine Werbung für kostenpflichtige Kurse ohne eigene Anmeldung oder persönliche Einladung
- id: jimdo-anfragen-und-nachrichten
  name: Jimdo-Anfragen und Nachrichten
  enabled: true
  description: Anfragen und persönliche Nachrichten, die über die eigene Jimdo-Webseite
    oder deren Kontaktformular per E-Mail eingehen.
  examples:
  - Neue Kontaktanfrage über das Jimdo-Kontaktformular
  - Über Jimdo übermittelte Frage zu einem Angebot
  - Persönliche Nachricht eines Besuchers der Jimdo-Webseite
  exclusions:
  - Allgemeine Werbung und Newsletter von Jimdo ohne konkrete Anfrage eines Webseitenbesuchers
- id: camping-und-stellplatzbuchungen
  name: Camping- und Stellplatzbuchungen
  enabled: true
  description: Buchungen der eigenen Camping- und Stellplätze über Nomady, Campspace
    oder Roadsurfer, einschließlich Buchungsbestätigungen, Buchungsänderungen und
    Stornierungen.
  examples:
  - Neue Stellplatzbuchung über Nomady mit Anreise und Abreise
  - Bestätigung einer Campingplatzbuchung über Campspace
  - Änderung oder Stornierung einer Stellplatzbuchung über Roadsurfer
  exclusions:
  - Allgemeine Werbung und Newsletter der Buchungsplattformen ohne konkrete Buchung
- id: behoerden-auflagen-betrieb
  name: Behörden und Auflagen für Betrieb und Biogasanlage
  enabled: true
  description: Schreiben und Anforderungen von Behörden wie Landratsamt, Gewerbeaufsicht,
    Immissionsschutz, Baurechtsamt oder Landwirtschaftsamt zum landwirtschaftlichen Betrieb
    und zur Biogasanlage, etwa Nachweise, Prüfberichte, Fristen, Kontrollen und Auflagen.
  examples:
  - Anforderung aktueller Prüfberichte und Bescheinigungen zur Biogasanlage
  - Nachweis der Betreiberschulungen
  - Stand der Umwallung oder anderer baulicher Auflagen
  - Ankündigung einer Vor-Ort-Kontrolle
  - Bescheid oder Anhörung mit Frist
  exclusions:
  - Allgemeine Newsletter und Pressemitteilungen der Behörden ohne Bezug zum eigenen Betrieb
- id: persoenliche-termine-und-terminhinweise
  name: Persönliche Termine und Terminhinweise
  enabled: true
  description: Mails, die dir persönlich einen konkreten Termin mitteilen, bestätigen,
    ändern oder absagen, oder einen Plan mit eigenen Einsätzen enthalten, etwa
    Terminbestätigungen von Praxen, Handwerkern oder Behörden, Einsatz-, Dienst-,
    Stunden- oder Blockpläne mit deinem Namen sowie Erinnerungen an vereinbarte Termine,
    auch wenn die Termine nur im Anhang stehen.
  examples:
  - Blockplan im PDF-Anhang, in dem du an zwei Tagen als Dozent eingeteilt bist
  - Terminbestätigung einer Praxis oder Werkstatt mit Datum und Uhrzeit
  - Mitteilung, dass ein vereinbarter Vor-Ort-Termin auf einen anderen Tag verlegt wird
  exclusions:
  - Werbung, Rabattaktionen oder Newsletter mit Fristen ohne persönlich vereinbarten Termin
  - Allgemeine Veranstaltungshinweise ohne eigene Einladung, Anmeldung oder Einteilung
  - Liefer- und Paketankündigungen
