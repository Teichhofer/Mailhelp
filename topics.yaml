topics:
- id: wohnung
  name: Wohnung
  enabled: true
  description: Nachrichten zum eigenen Mietverhältnis und zur Hausverwaltung.
  examples:
  - Betriebskostenabrechnung
  - Wartungstermin
  exclusions:
  - Immobilienwerbung
- id: gemeinderat
  name: Gemeinderat
  enabled: true
  description: Nachrichten zur Arbeit des Gemeinderats, seinen Sitzungen und kommunalpolitischen
    Themen.
  examples:
  - Sitzungseinladung
  - Tagesordnung
  - Beschlussvorlage
  exclusions:
  - Allgemeine Parteienwerbung ohne Bezug zum Gemeinderat
- id: landfrauen
  name: Landfrauen
  enabled: true
  description: Nachrichten zum Landfrauenverein, seinen Veranstaltungen und Vereinsaktivitäten.
  examples:
  - Veranstaltungseinladung
  - Vereinsversammlung
  - Kursangebot
  exclusions:
  - Allgemeine Werbung ohne Bezug zum Landfrauenverein
- id: auslaenderbehoerde
  name: Ausländerbehörde
  enabled: true
  description: Nachrichten der Ausländerbehörde zu Aufenthalt, Einbürgerung und behördlichen
    Terminen.
  examples:
  - Terminbestätigung
  - Aufenthaltstitel
  - Unterlagenanforderung
  exclusions:
  - Allgemeine Reise- und Tourismuswerbung
- id: kommunalverwaltung-und-sitzungsinformationen
  name: Kommunalverwaltung und Sitzungsinformationen
  enabled: true
  description: Informationsmails der Gemeindeverwaltung zu Ratsvorlagen und Tagesordnungspunkten,
    Personalentscheidungen sowie Befragungen zu kommunalen Einrichtungen.
  examples:
  - Neu eingestellte Sitzungsvorlagen im Ratsinformationssystem
  - Zusätzliche Tagesordnungspunkte für Gemeinderatssitzung
  - Bewerbervorstellung für eine Leitungsstelle
  - Elternbefragung zu städtischen Kindertageseinrichtungen
  exclusions: []
- id: termin-und-meeting-koordination
  name: Termin- und Meeting-Koordination
  enabled: true
  description: E-Mails zur Vereinbarung, Verschiebung oder Durchführung von Treffen
    inklusive Zugangsdaten für Online-Konferenzen.
  examples:
  - Meeting wird auf einen späteren Tag verschoben
  - Zugangsdaten für ein Videomeeting
  exclusions: []
- id: personlicher-smalltalk-private-korrespondenz
  name: Persönlicher Smalltalk & private Korrespondenz
  enabled: true
  description: Lockere private Nachrichten über Hobbys, Serien, Musik, Schule und
    Alltagsfragen sowie kurze persönliche Zwischenmeldungen.
  examples:
  - Frage nach der Lieblingsserie oder dem Lieblingsbuch
  - Kurze private Rückmeldung wie 'Alles gut' innerhalb eines Gesprächs
  exclusions: []
- id: vereins-verbands-organisationskommunikation
  name: Vereins-, Verbands- & Organisationskommunikation
  enabled: true
  description: 'Organisatorische Korrespondenz rund um Vereine und Verbände: Presseartikel-Einreichungen,
    Vorstandsarbeit, Einladungen, Petitionen und interne Kurznotizen.'
  examples:
  - Vereinsbericht mit Foto an die Lokalredaktion eingereicht
  - Newsletter einer Petitionsplattform mit Aufruf zum Unterzeichnen
  exclusions: []
- id: serviceauftrage-reparaturanfragen
  name: Serviceaufträge & Reparaturanfragen
  enabled: true
  description: Übermittlung von Wartungs- und Instandsetzungsaufträgen, teils als
    dringende Reparaturanfrage einzelner Bauteile.
  examples:
  - Ausgefülltes Serviceauftragsformular im Anhang
  - Eilige Reparaturanfrage für die Drosselklappe eines Fahrzeugs
  exclusions: []
