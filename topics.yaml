topics:
- id: vlf
  name: VLF
  enabled: true
  description: alles das mit dem VLF, dem Verband für Ländliche Fachbildung zu tun hat
  examples:
  - Infirmationen
  - Termine
  - Ankündigungen
  - Anfragen
  exclusions:
  - Immobilienwerbung
- id: gemeinderat
  name: Gemeinderat
  enabled: true
  description: Nachrichten zur Arbeit des Gemeinderats, seinen Sitzungen und kommunalpolitischen
    Themen.
  examples:
  - Sitzungseinladung
  - Tagesordnung
  - Beschlussvorlage
  exclusions:
  - Allgemeine Parteienwerbung ohne Bezug zum Gemeinderat
- id: landfrauen
  name: Landfrauen
  enabled: true
  description: Nachrichten zum Landfrauenverein, seinen Veranstaltungen und Vereinsaktivitäten.
  examples:
  - Veranstaltungseinladung
  - Vereinsversammlung
  - Kursangebot
  exclusions:
  - Allgemeine Werbung ohne Bezug zum Landfrauenverein
- id: auslaenderbehoerde
  name: Ausländerbehörde
  enabled: true
  description: Nachrichten der Ausländerbehörde zu Aufenthalt, Einbürgerung und behördlichen
    Terminen.
  examples:
  - Terminbestätigung
  - Aufenthaltstitel
  - Unterlagenanforderung
  exclusions:
  - Allgemeine Reise- und Tourismuswerbung
- id: kommunalverwaltung-und-sitzungsinformationen
  name: Kommunalverwaltung und Sitzungsinformationen
  enabled: true
  description: Informationsmails der Gemeindeverwaltung zu Ratsvorlagen und Tagesordnungspunkten,
    Personalentscheidungen sowie Befragungen zu kommunalen Einrichtungen.
  examples:
  - Neu eingestellte Sitzungsvorlagen im Ratsinformationssystem
  - Zusätzliche Tagesordnungspunkte für Gemeinderatssitzung
  - Bewerbervorstellung für eine Leitungsstelle
  - Elternbefragung zu städtischen Kindertageseinrichtungen
  exclusions: []
- id: landwirtschaftliche-fachveranstaltungen-und-fortbildungen
  name: Landwirtschaftliche Fachveranstaltungen und Fortbildungen
  enabled: true
  description: Einladungen, An- und Abmeldungen, Buchungsbestätigungen und Erinnerungen
    zu Fachseminaren und Webinaren für die Landwirtschaft, etwa zu Biogas, Tiergesundheit
    oder Pflanzenbau.
  examples:
  - Einladung zu einem kostenfreien Webseminar mit Anmeldelink und Programm
  - Anmeldebestätigung für ein Fachseminar mit Termin und Zugangslink
  exclusions: []
- id: verbands-und-vereinskommunikation
  name: Verbands- und Vereinskommunikation
  enabled: true
  description: Rundmails an Verbands- und Vereinsmitglieder sowie Vereinsangelegenheiten
    wie Mitgliederversammlungen, Vorstandswechsel oder drohende Auflösung.
  examples:
  - Rundschreiben eines Verbands an die Mitgliedschaft mit aktuellen Themen
  - Einladung zur Jahreshauptversammlung mit Tagesordnung im Anhang
  exclusions: []
- id: agrarpolitische-interessenvertretung-und-kundgebungen
  name: Agrarpolitische Interessenvertretung und Kundgebungen
  enabled: true
  description: Aufrufe eines Berufsverbands zu Demonstrationen und Kundgebungen sowie
    Darstellung agrarpolitischer Forderungen und Positionspapiere.
  examples:
  - Aufruf zur Teilnahme an einer Kundgebung mit Treffpunkt und Rückmeldefrist
  - Forderungspapier zu Rahmenbedingungen und EU-Agrarförderung
  exclusions: []
- id: pflanzenbau-infoservice-und-fachnewsletter
  name: Pflanzenbau-Infoservice und Fachnewsletter
  enabled: true
  description: Regelmäßige Fachinformationen zum Acker- und Pflanzenbau inklusive
    Sortenempfehlungen, meist als Anhang verteilt.
  examples:
  - Aktueller Infoservice mit Hinweisen zu Feldarbeiten als PDF-Anhang
  - Sortenempfehlungen für die kommende Anbausaison
  exclusions: []
- id: energie-und-netzbetreiberkommunikation
  name: Energie- und Netzbetreiberkommunikation
  enabled: true
  description: Mitteilungen von Netzbetreibern und Energieportalen zu Zählerablesung,
    Abrechnung sowie Netzanschluss und Erzeugungsanlagen.
  examples:
  - Aufforderung, den Zählerstand fristgerecht online zu melden
  - Stornierung einer Anfrage für eine geplante Erzeugungsanlage
  exclusions: []
- id: vertragsabschluss-und-elektronische-signatur
  name: Vertragsabschluss und elektronische Signatur
  enabled: true
  description: Benachrichtigungen zu elektronischen Signaturvorgängen und Vertragsunterlagen,
    etwa zur Direktvermarktung von Photovoltaikanlagen.
  examples:
  - Bitte prüfen und signieren Sie das Vertragsdokument online
  - Vertragsanlage mit AGB und SEPA-Mandat
  exclusions: []
- id: grundbuch-landtausch-und-bankkorrespondenz
  name: Grundbuch, Landtausch und Bankkorrespondenz
  enabled: true
  description: Korrespondenz mit Behörden, Notaren und Banken zu Grundschuldlöschungen,
    freiwilligem Flurstücktausch und zugehörigen Vorgängen.
  examples:
  - Stand der Löschungsbewilligung für eine Grundschuld
  - Antrag auf freiwilligen Tausch zweier Flurstücke
  exclusions: []
- id: behordliche-forder-und-antragsverfahren
  name: Behördliche Förder- und Antragsverfahren
  enabled: true
  description: Benachrichtigungen aus Behördenpostfächern zu Agrarförderanträgen,
    fehlenden Nachweisen und Fristen.
  examples:
  - Neue Nachricht in Ihrem Antragstellerpostfach verfügbar
  - 'Erinnerung: Nachweise bitte bis zum Stichtag einreichen'
  exclusions: []
- id: versicherungs-schadenmitteilungen
  name: Versicherungs-Schadenmitteilungen
  enabled: true
  description: Begleitschreiben von Versicherern zur Übermittlung von Schadensunterlagen
    als Anhang.
  examples:
  - Schadenmitteilung mit Schadennummer und PDF im Anhang
  - Hinweis, einen fehlenden Anhang zu melden
  exclusions: []
- id: agrar-veranstaltungen
  name: Agrar-Veranstaltungen
  enabled: true
  description: Ankündigungen von Feldtagen, Thementagen und Fachveranstaltungen für
    die Land- und Forstwirtschaft.
  examples:
  - Einladung zu einem Feldtag auf einem Betrieb
  - Ankündigung von Forst-Thementagen
  exclusions: []
