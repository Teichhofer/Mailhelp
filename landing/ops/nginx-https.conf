limit_req_zone $binary_remote_addr zone=inboxstride_signup:1m rate=3r/m;
limit_conn_zone $server_name zone=inboxstride_connections:1m;

server {
    listen 443 ssl;
    http2 on;
    server_name www.inboxstride.de;
    ssl_certificate /etc/letsencrypt/live/inboxstride.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inboxstride.de/privkey.pem;
    access_log off;
    return 308 https://inboxstride.de$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name inboxstride.de;
    ssl_certificate /etc/letsencrypt/live/inboxstride.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inboxstride.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:InboxstrideTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    root /opt/inboxstride/current/public;
    index index.html;
    charset utf-8;
    access_log off;
    error_log /var/log/nginx/inboxstride-error.log crit;
    client_max_body_size 4k;
    client_body_timeout 10s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; font-src 'self'; img-src 'self' https://*.google-analytics.com https://www.googletagmanager.com; media-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location = /api/interest {
        limit_req zone=inboxstride_signup burst=3 nodelay;
        limit_req_status 429;
        limit_conn inboxstride_connections 16;
        proxy_pass http://127.0.0.1:8877;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection close;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location /api/ { return 404; }
    location ~ /\. { return 404; }
    location ~* "^/assets/.+\.[a-f0-9]{12}\.(?:css|js|woff2|webp|svg|mp4)$" {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }
}
