timezone: Europe/Berlin
poll_interval_seconds: 60
test_mode: true
data_directory: data/test
imap:
  host: imap.example.invalid
  port: 993
  folders: [INBOX]
telegram:
  user_id: 123456
  chat_id: 123456
targets:
  todoist_project: inbox
  google_calendar: primary
limits:
  max_mail_bytes: 1000000
  llm_calls_per_minute: 10
retries:
  validation: 1
timeouts:
  imap: {timeout_seconds: 30, retries: 2, initial_backoff_seconds: 1, max_backoff_seconds: 8}
  telegram: {timeout_seconds: 35, retries: 2, initial_backoff_seconds: 1, max_backoff_seconds: 8}
  openrouter: {timeout_seconds: 30, retries: 2, initial_backoff_seconds: 1, max_backoff_seconds: 8}
  todoist: {timeout_seconds: 30, retries: 2, initial_backoff_seconds: 1, max_backoff_seconds: 8}
  google_calendar: {timeout_seconds: 30, retries: 2, initial_backoff_seconds: 1, max_backoff_seconds: 8}
  telegram_poll_seconds: 30
logging:
  directory: logs
  level: INFO
  include_llm_requests: false
  include_llm_responses: false
