# IANA-Nutzerzeitzone für Analyse und Google Calendar. Sie wird zusammen mit
# ursprünglichem/geprüftem Date-Header und IMAP-INTERNALDATE an das LLM gegeben;
# Zeitwerte selbst müssen zusätzlich einen eindeutigen UTC-Offset enthalten.
timezone: Europe/Berlin
poll_interval_seconds: 60
test_mode: true
# Mailhelp ergänzt je nach test_mode automatisch /test oder /production.
data_directory: data
# Aufbewahrung gilt ausschließlich für sicher abgeschlossene Vorgänge. Ganze
# Zahlen bedeuten 1..3650 Tage. "disabled" entfernt den Inhalt beim nächsten
# Lauf sofort; "unlimited" bewahrt ihn unbegrenzt auf. Technische Identität,
# Vorschlagsversionen, Idempotenzschlüssel und externe Ergebnisse bleiben erhalten.
retention:
  full_mail_days: 30
  debug_llm_days: disabled
imap:
  host: imap.web.de
  port: 993
  connection_mode: ssl
  historical_start: null
  # Pro Polling-Zyklus werden höchstens so viele Nachrichten geladen und direkt
  # verarbeitet. Das verhindert lange stille Erstabrufe großer Postfächer.
  batch_size: 25
  folders: [INBOX]
telegram:
  user_id: 123456
  chat_id: 123456
targets:
  # Echte Todoist-Projekt-ID (nicht Projektname, URL oder Alias).
  todoist_project: "6hX5f7MxfC4Qmcrv"
  google_calendar: primary
limits:
  max_mail_bytes: 1000000
  max_mime_parts: 100
  max_decoded_text_bytes: 1000000
  max_html_characters: 1000000
  max_html_tags: 20000
  max_html_depth: 100
  max_llm_payload_bytes: 500000
  llm_calls_per_minute: 10
retries:
  validation: 1
timeouts:
  imap: {timeout_seconds: 30, retries: 2, initial_backoff_seconds: 1, max_backoff_seconds: 8}
  telegram: {timeout_seconds: 35, retries: 2, initial_backoff_seconds: 1, max_backoff_seconds: 8}
  openrouter: {timeout_seconds: 30, retries: 2, initial_backoff_seconds: 1, max_backoff_seconds: 8}
  todoist: {timeout_seconds: 30, retries: 2, initial_backoff_seconds: 1, max_backoff_seconds: 8}
  google_calendar: {timeout_seconds: 30, retries: 2, initial_backoff_seconds: 1, max_backoff_seconds: 8}
  telegram_poll_seconds: 30
logging:
  directory: logs
  console:
    enabled: true
    level: INFO
    format: text
  file:
    enabled: true
    level: INFO
    format: jsonl
    filename: application.jsonl
    max_bytes: 10000000
    backup_count: 5
    retention_days: 30
  modules:
    openrouter: INFO
  llm:
    enabled: true
    level: INFO
    format: jsonl
    filename: llm/requests.jsonl
    max_bytes: 10000000
    backup_count: 5
    retention_days: 30
    include_requests: false
    include_responses: false
