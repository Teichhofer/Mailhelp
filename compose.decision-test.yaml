services:
  mailhelp-decision-test:
    build: .
    init: true
    restart: "no"
    stop_grace_period: 45s
    env_file: [.env]
    extra_hosts: ["host.docker.internal:host-gateway"]
    command: ["--config-directory", "/config", "--decision-test", "${DECISION_TEST_MAILS:-20}", "--ollama", "${DECISION_TEST_OLLAMA:-host.docker.internal:11434}"]
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./prompts.yaml:/config/prompts.yaml:ro
      - ./decisions_prompts.yaml:/config/decisions_prompts.yaml:ro
      - ./laya_prompts.yaml:/config/laya_prompts.yaml:ro
      - ./topics.yaml:/config/topics.yaml:ro
      - ./irrelevant_topics.yaml:/config/irrelevant_topics.yaml:ro
      - ./data:/config/data
