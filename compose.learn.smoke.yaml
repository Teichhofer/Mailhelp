services:
  mailhelp:
    network_mode: none
    entrypoint: [python, -m, pytest]
    command: ["-q", "--no-cov", "-p", "no:cacheprovider", "/tests/e2e/test_container_learning.py"]
    environment:
      MAILHELP_LEARNING_CONFIG: /config
      # /tests is the package tests; its parent makes tests.fakes importable.
      PYTHONPATH: /
    volumes:
      - ./tests:/tests:ro
