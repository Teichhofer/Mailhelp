services:
  mailhelp:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file: [.env]
    # Weboberfläche (web.enabled): im Container auf 0.0.0.0 lauschen, auf dem Host
    # ausschließlich über 127.0.0.1 erreichbar (Tailscale Serve läuft auf dem Host).
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./prompts.yaml:/config/prompts.yaml:ro
      - ./decisions_prompts.yaml:/config/decisions_prompts.yaml:ro
      - ./topics.yaml:/config/topics.yaml:ro
      - ./irrelevant_topics.yaml:/config/irrelevant_topics.yaml:ro
      - type: bind
        source: ./irrelevant-senders.json
        target: /config/irrelevant-senders.json
        read_only: true
        bind:
          create_host_path: false
      - ./data:/config/data
      - ./logs:/config/logs
