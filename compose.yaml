services:
  mailhelp:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file: [.env]
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./prompts.yaml:/config/prompts.yaml:ro
      - ./topics.yaml:/config/topics.yaml:ro
      - ./data:/app/data
      - ./logs:/app/logs
