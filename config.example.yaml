# Erläuterungen aller Web-Einstellungen: docs/Web-Einstellungen.md (auch als Info-Blasen in der Weboberfläche).
# Optionaler Vergleich: mailhelp --decision-test 20 --ollama localhost:11434
# Standard (Jev-Relevanz + LLM-Rückfall) gegen Ollama; nur relevante Mails weiter.
# Standardrelevanz: Jev aus decisions_prompts.yaml; nur unclear nutzt prompts.yaml.
# Fehlt die Jev-Datei, gilt die mitgelieferte Vorlage; --check validiert sie.
# Alle weiteren Stufen bleiben auf dem bisherigen LLM aus prompts.yaml.
# Bericht und JSONL unter data_directory/decision-tests; keine Schreibdienste.
# Für lokale Nutzung nach config.yaml kopieren und Verbindungen/Ziele anpassen.
# Geheimnisse ausschließlich in .env oder in der Prozessumgebung hinterlegen.
# Auch non_binding und "Erneut anlegen" erfordern versionsbezogene Bestätigung über Telegram oder die authentifizierte Weboberfläche.
# test_mode simuliert Todoist und Google Kalender ohne Zugriff auf die Schreibdienste.
# Relative Daten-/Logpfade gelten relativ zu --config-directory, auch bei --clear.
# Docker bindet data und logs unter /config/data bzw. /config/logs ein.
# Normalbetrieb: irrelevant-senders.json aus der Vorlage anlegen und mit einbinden.
# Lernen im Container: compose.learn.yaml bindet learning-config als Verzeichnis ein.
# Offene Vorschläge blockieren die Analyse nicht; nur unklare Relevanz wartet auf Telegram.
timezone: Europe/Berlin
# 3.0: Neues Profil bewusst neutral. Bestehende Installationen ohne diesen
# Abschnitt behalten ihre Kanäle/Inhaltsfreigaben; Ruhezeit und Bündelung bleiben aus.
# Profil und Entwürfe unter /einrichtung bzw. /einstellungen/benachrichtigungen.
notifications:
  quiet_hours:
    enabled: false
    start: "22:00"
    end: "07:30"
    allow_system_errors: false
  batching:
    enabled: false
    window_seconds: 300
  categories:
    decisions: [telegram]
    action_results: [telegram]
    daily_briefing: [telegram]
    system_errors: [telegram]
  telegram_content: neutral  # summary übermittelt Betreffzeilen/Tagesüberblick
  delivery:
    max_attempts: 3
    initial_backoff_seconds: 30
    max_backoff_seconds: 900
    history_days: 30
    max_pending: 1000
# 2.0: Schaltflächen Zusagen/Absagen/Rückfrage auf der Mailseite; ein Klick lässt das
# LLM (Prompt draft_reply) einen Entwurf formulieren. Gespeichert wird nur nach
# ausdrücklichem Klick per IMAP APPEND in imap.drafts_folder; Mailhelp sendet nie.
smart_reply: false
# Eigene Angaben für Antwort-Entwürfe (Name, Rolle, Signatur, Anrede-/Stilwünsche),
# höchstens 2.000 Zeichen. Gehen an die Prompts draft_reply und (ab 2.2) activity_relevance;
# auch unter Einstellungen → Antworten bearbeitbar und dort sofort wirksam.
personal_info: ""
activity_report:
  # 2.2: Tätigkeitsberichte unter /berichte. Ein Bericht liest die Mails eines Zeitraums
  # nur (IMAP BODY.PEEK, keine Flags), prüft sie per LLM auf das Berichtsthema, findet
  # Termine und erstellt eine xlsx-Liste. Nichts wird in Postfach, Kalender oder Todoist
  # geschrieben. Benötigt die Prompts activity_relevance und activity_events.
  enabled: false
  max_mails: 2000                  # Bericht pausiert bei Erreichen
  max_llm_calls: 3000              # Bericht pausiert bei Erreichen
  max_share_of_llm_budget: 0.5     # Anteil von limits.llm_calls_per_minute
  max_fulltext_chars: 30000        # Volltext je Mail in Bericht und xlsx (1000–32000)
  export_mails_without_events: true  # Blatt „Ohne Termin“ in der xlsx-Liste
push:
  # Web-Push (VAPID) für die App; nur über HTTPS oder localhost. Jedes Gerät schaltet
  # Push zusätzlich unter Einstellungen ein. Meldungen enthalten keine Mailinhalte.
  enabled: false
  subject: mailto:admin@example.invalid  # Kontaktadresse des Betreibers für VAPID
daily_briefing:
  # Tagesüberblick (Termine, fällige Aufgaben, offene Entscheidungen), nur lesend.
  # Telegram erhält den Text, Web-Push nur einen neutralen Hinweis; /briefing zeigt ihn.
  enabled: false
  time: "07:30"  # HH:MM in der Zeitzone oben; einmal je lokalem Kalendertag
  include_calendar: true
  include_tasks: true
  include_open: true
poll_interval_seconds: 60
test_mode: false
data_directory: data
retention:
  full_mail_days: 30
  debug_llm_days: disabled
  # Ab 1.2: kompakte Analyse (Relevanz, Begründung, Themen, Zusammenfassung) für die
  # Weboberfläche. Fehlt der Schlüssel, gilt wie bisher debug_llm_days. 30 bewusst setzen,
  # damit Analysen nach Abschluss eines Vorgangs 30 Tage sichtbar bleiben.
  # analysis_days: 30
  # Ab 1.2: angezeigter Entscheidungsverlauf (Ereignisse, ältere Vorschlagsversionen).
  history_days: 90
  # Ab 2.2: Volltexte und Belegzitate abgeschlossener Tätigkeitsberichte; Termine,
  # Absender und Betreffe bleiben. Zahl, disabled (sofort) oder unlimited.
  activity_report_days: 365
metrics:
  # Ab 1.2: inhaltsfreie Messung von KI-Aufrufen (Dauer, Modell, Schritt, Kosten) für
  # die Seite „Auswertung“. Gespeichert in logs/metrics/.
  enabled: true
  retention_days: 90
  # Annahmen für die Stromschätzung im Ollama-Betrieb (keine Messung):
  # Leistung des ganzen Servers in Watt und Strompreis in EUR je kWh.
  ollama_power_watts: 300
  electricity_eur_per_kwh: 0.30
  # Standard-Wechselkurs für die Umrechnung von USD-Kosten in Euro (1 € = 1,10 $).
  usd_per_eur: 1.1
  # Optional mit Bezugsdatum:
  # exchange_rate_date: 2026-10-11
vision:
  # Ab 1.4: Bildanhänge (JPG, PNG, WebP) und gescannte PDFs werden per
  # Bilderkennung gelesen (Schritt vision_ocr in prompts.yaml). Dabei gehen die
  # Bilder an den KI-Anbieter. Symbole und Logos (unter 150 × 150 Pixel oder
  # 10 KB) werden nie gesendet. false schaltet die Bilderkennung ab.
  enabled: true
  # Höchstens so viele Bilder bzw. Scanseiten je Mail.
  max_images_per_mail: 3
  # Größere Anhänge werden nicht gelesen (10 MB).
  max_image_bytes: 10485760
  # Längste Bildkante nach dem Verkleinern; spart Tokens.
  max_edge_pixels: 1600
learning:
  parallel_llm_calls: 10
# 3.1: Mehrere Postfächer (höchstens 10) statt der Postfachfelder direkt unter imap
# (= Postfach 1): Liste imap.mailboxes mit stabiler Nummer id (1–99), Anzeigename label
# und enabled. Abruf, Kontingent und Duplikaterkennung gelten über alle Postfächer; Entwürfe
# und Tätigkeitsberichte bleiben im jeweiligen Postfach. --learn/--decision-test brauchen
# dann --mailbox <id>. Beispiel:
#   imap:
#     batch_size: 25
#     global_newest_first: true
#     mailboxes:
#     - id: 1                 # Zugangsdaten IMAP_1_USERNAME/IMAP_1_PASSWORD
#       label: Privat
#       host: imap.example.test
#       port: 993
#       folders: [INBOX]
# Beide Schreibweisen gleichzeitig sind ungültig. Postfachangaben ändern keinen
# Analyse-Fingerprint; laufende Mails werden dadurch nicht zurückgehalten.
imap:
  drafts_folder: Drafts  # Unicode erlaubt; muss auf dem IMAP-Server existieren
  host: imap.example.test
  port: 993
  connection_mode: ssl
  historical_start: '2026-09-15T00:00:00+02:00'
  batch_size: 25
  global_newest_first: true
  primary_folder: INBOX
  folders:
  - INBOX
  - Drafts
  - Sent
  - Spam
  - Trash
telegram:
  # false (2.0): Betrieb nur mit Weboberfläche/App, web.enabled muss true sein,
  # TELEGRAM_BOT_TOKEN entfällt; Kopplungscodes erscheinen in der Konsole des PCs.
  enabled: true
  # Bei jedem normalen Start wird die Befehlsübersicht automatisch gesendet,
  # auch mit --max-mails und bei Wiederaufnahme offener Entscheidungen.
  # Nur dieser Nutzer in diesem Chat darf auch /hilfe, /status, /offen und
  # /abbrechen verwenden. /start zeigt ebenfalls die Hilfe.
  # Anzeigezeiten verwenden timezone; Befehle benötigen keine weitere Option.
  # /abbrechen schließt die Bearbeitung, verwirft aber keinen Vorschlag.
  user_id: 1
  chat_id: 2
  # true: Immer nur eine offene Entscheidung. Nach einer Nachricht mit
  # Entscheidungsschaltflächen (Relevanzfrage, Vorschlag mit „Klären“ oder
  # vollständiger Vorschlag mit „Im Kalender/In Todoist anlegen“) werden weitere
  # Nachrichten zurückgehalten, bis die Entscheidung erledigt ist; danach folgen
  # sie der Reihe nach bis zur nächsten Entscheidung. Neustart und /offen zeigen
  # nur die aktuelle Entscheidung mit Schaltflächen.
  # Die Warteschlange liegt in telegram-outbox.json. false: sofort senden.
  # Offene Entscheidungen halten spätere Nachrichten zurück, auch nach unklarem Versand.
  # Noch zurückgehaltene Relevanzfragen pausieren nur ihre eigene Mailanalyse.
  sequential_questions: true
targets:
  # Bestätigungen gelten für das im Vorschlag gespeicherte Ziel. Bei Abweichung
  # bleiben Schreiben und Abgleich gesperrt (auch nach Neustart/im Testmodus).
  # Ursprüngliches Ziel wiederherstellen oder neuen Vorschlag bestätigen.
  # Kalenderdienst: google | caldav (Nextcloud, iCloud, mailbox.org, …) | outlook (Microsoft 365).
  calendar_provider: google
  # Aufgabendienst: todoist | microsoft_todo | caldav (VTODO) | apple_reminders (iCloud-CalDAV;
  # auf die neuen iCloud-Erinnerungen aktualisierte Listen sind über CalDAV nicht erreichbar).
  task_provider: todoist
  todoist_project: example-project
  google_calendar: primary
  # Nur bei caldav/apple_reminders: vollständige https-Adressen der Sammlungen.
  # Zugang über CALDAV_USERNAME und App-Passwort CALDAV_PASSWORD in .env.
  caldav_calendar_url: ""
  caldav_task_url: ""
  # Nur bei outlook/microsoft_todo: Kalender- bzw. Listen-ID oder default.
  # Anmeldung einmalig mit "mailhelp --microsoft-login" (MICROSOFT_CLIENT_ID in .env).
  outlook_calendar: default
  microsoft_todo_list: default
  microsoft_tenant: common
# Originaldokumente (PDF, Word, Excel, OpenDocument, Text, Bilder) neu verarbeiteter Mails
# zum Herunterladen in der Weboberfläche; gelöscht mit retention.full_mail_days.
attachments:
  store_originals: true
  max_original_bytes: 26214400
  max_total_bytes: 52428800
limits:
  max_mail_bytes: 1000000
  max_header_bytes: 64000
  max_display_header_characters: 500
  max_mime_parts: 100
  max_decoded_text_bytes: 1000000
  max_html_characters: 1000000
  max_html_tags: 20000
  max_html_depth: 100
  max_llm_payload_bytes: 500000
  llm_calls_per_minute: 600
retries:
  provider_retry: 1
  json_repair: 1
  schema_repair: 1
  interpretation_attempts: 3
  interpretation_backoff_seconds: 60
  revision_attempts: 3
  revision_backoff_seconds: 60
timeouts:
  imap:
    timeout_seconds: 30
    retries: 2
    initial_backoff_seconds: 1
    max_backoff_seconds: 8
  telegram:
    timeout_seconds: 35
    retries: 2
    initial_backoff_seconds: 1
    max_backoff_seconds: 8
  openrouter:
    timeout_seconds: 30
    retries: 2
    initial_backoff_seconds: 1
    max_backoff_seconds: 8
  todoist:
    timeout_seconds: 30
    retries: 2
    initial_backoff_seconds: 1
    max_backoff_seconds: 8
  google_calendar:
    timeout_seconds: 30
    retries: 2
    initial_backoff_seconds: 1
    max_backoff_seconds: 8
  caldav:
    timeout_seconds: 30
    retries: 2
    initial_backoff_seconds: 1
    max_backoff_seconds: 10
  microsoft:
    timeout_seconds: 30
    retries: 2
    initial_backoff_seconds: 1
    max_backoff_seconds: 10
  telegram_poll_seconds: 30
  # Für den lokalen Modus und --decision-test. Lokale Modelle antworten
  # deutlich langsamer; ohne Angabe gelten genau diese Werte.
  ollama:
    timeout_seconds: 1800
    retries: 1
    initial_backoff_seconds: 2
    max_backoff_seconds: 10
logging:
  directory: logs
  console:
    enabled: true
    level: INFO
    format: text
  file:
    enabled: true
    level: INFO
    format: jsonl
    filename: application.jsonl
    max_bytes: 10000000
    backup_count: 5
    retention_days: 30
  modules:
    openrouter: INFO
  llm:
    enabled: true
    level: INFO
    format: jsonl
    filename: llm/requests.jsonl
    max_bytes: 10000000
    backup_count: 5
    retention_days: 30
    include_requests: true
    include_responses: true
  telegram:
    enabled: true
    level: INFO
    format: jsonl
    filename: telegram/messages.jsonl
    max_bytes: 10000000
    backup_count: 5
    retention_days: 30
event_defaults:
  # Nur fehlendes Ende bei belegter Teilnahmeart und eindeutigem Beginn ergänzen.
  # Explizite Endzeiten/Dauern haben Vorrang. Alte Vorschläge bleiben unverändert.
  video_duration_minutes: 60
  in_person_duration_minutes: 180
proposal_reconciliation:
  # Mehr mögliche Treffer blockieren die automatische Zuordnung.
  max_semantic_candidates: 8
web:
  # Die Webübersicht behält die Auswahl beim Neuladen automatisch bei; keine Option n?tig.
  # Optionale Weboberfläche (ab 1.1). Standard: aus – Mailhelp verhält sich dann wie 1.0.
  # Mit enabled: true wird MAILHELP_WEB_SECRET (mindestens 32 Zeichen) in .env benötigt.
  enabled: false
  # Nur lokal lauschen. Im Docker-Container 0.0.0.0 verwenden und den Port in
  # compose.yaml ausschließlich auf 127.0.0.1 des Hosts veröffentlichen.
  host: 127.0.0.1
  port: 8765
  # Genau diese Host-Header werden angenommen (Schutz gegen DNS-Rebinding).
  # Für das iPhone über Tailscale Serve den Tailnet-Namen ohne Port ergänzen,
  # z. B. mailhelp-pc.tailnet-name.ts.net
  allowed_hosts: [127.0.0.1:8765, localhost:8765]
  # Gültigkeit einer gekoppelten Browsersitzung in Tagen.
  session_days: 30
  # Zugriff im eigenen WLAN über die IP-Adresse des PCs (unverschlüsseltes HTTP).
  # Benötigt host: 0.0.0.0; /web sendet dann den Link mit der aktuellen IP.
  lan_access: false
