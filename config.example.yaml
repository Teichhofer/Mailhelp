# Optionaler isolierter Vergleich: mailhelp --decision-test 20
# Nur dafür decisions_prompts.yaml im Konfigurationsverzeichnis bereitstellen.
# Bericht und JSONL unter data_directory/decision-tests; keine Schreibdienste.
# Für lokale Nutzung nach config.yaml kopieren und Verbindungen/Ziele anpassen.
# Geheimnisse ausschließlich in .env oder in der Prozessumgebung hinterlegen.
# Auch non_binding und "Erneut anlegen" erfordern versionsbezogene Telegram-Bestätigung.
# test_mode simuliert nur Todoist; bestätigte Kalendertermine werden tatsächlich angelegt.
# Relative Daten-/Logpfade gelten relativ zu --config-directory, auch bei --clear.
# Docker bindet data und logs unter /config/data bzw. /config/logs ein.
# Normalbetrieb: irrelevant-senders.json aus der Vorlage anlegen und mit einbinden.
# Lernen im Container: compose.learn.yaml bindet learning-config als Verzeichnis ein.
# Offene Vorschläge blockieren die Analyse nicht; nur unklare Relevanz wartet auf Telegram.
timezone: Europe/Berlin
poll_interval_seconds: 60
test_mode: false
data_directory: data
retention:
  full_mail_days: 30
  debug_llm_days: disabled
learning:
  parallel_llm_calls: 10
imap:
  host: imap.example.test
  port: 993
  connection_mode: ssl
  historical_start: '2026-09-15T00:00:00+02:00'
  batch_size: 25
  global_newest_first: true
  primary_folder: INBOX
  folders:
  - INBOX
  - Drafts
  - Sent
  - Spam
  - Trash
telegram:
  # Bei jedem normalen Start wird die Befehlsübersicht automatisch gesendet,
  # auch mit --max-mails und bei Wiederaufnahme offener Entscheidungen.
  # Nur dieser Nutzer in diesem Chat darf auch /hilfe, /status, /offen und
  # /abbrechen verwenden. /start zeigt ebenfalls die Hilfe.
  # Anzeigezeiten verwenden timezone; Befehle benötigen keine weitere Option.
  # /abbrechen schließt die Bearbeitung, verwirft aber keinen Vorschlag.
  user_id: 1
  chat_id: 2
  # true: Immer nur eine offene Entscheidung. Nach einer Nachricht mit
  # Entscheidungsschaltflächen (Relevanzfrage, Vorschlag mit „Klären“ oder
  # vollständiger Vorschlag mit „Im Kalender/In Todoist anlegen“) werden weitere
  # Nachrichten zurückgehalten, bis die Entscheidung erledigt ist; danach folgen
  # sie der Reihe nach bis zur nächsten Entscheidung. Neustart und /offen zeigen
  # nur die aktuelle Entscheidung mit Schaltflächen.
  # Die Warteschlange liegt in telegram-outbox.json. false: sofort senden.
  # Offene Entscheidungen halten spätere Nachrichten zurück, auch nach unklarem Versand.
  # Noch zurückgehaltene Relevanzfragen pausieren nur ihre eigene Mailanalyse.
  sequential_questions: true
targets:
  # Bestätigungen gelten für das im Vorschlag gespeicherte Ziel. Bei Abweichung
  # bleiben Schreiben und Abgleich gesperrt (auch nach Neustart/im Testmodus).
  # Ursprüngliches Ziel wiederherstellen oder neuen Vorschlag bestätigen.
  todoist_project: example-project
  google_calendar: primary
limits:
  max_mail_bytes: 1000000
  max_header_bytes: 64000
  max_display_header_characters: 500
  max_mime_parts: 100
  max_decoded_text_bytes: 1000000
  max_html_characters: 1000000
  max_html_tags: 20000
  max_html_depth: 100
  max_llm_payload_bytes: 500000
  llm_calls_per_minute: 600
retries:
  provider_retry: 1
  json_repair: 1
  schema_repair: 1
  interpretation_attempts: 3
  interpretation_backoff_seconds: 60
  revision_attempts: 3
  revision_backoff_seconds: 60
timeouts:
  imap:
    timeout_seconds: 30
    retries: 2
    initial_backoff_seconds: 1
    max_backoff_seconds: 8
  telegram:
    timeout_seconds: 35
    retries: 2
    initial_backoff_seconds: 1
    max_backoff_seconds: 8
  openrouter:
    timeout_seconds: 30
    retries: 2
    initial_backoff_seconds: 1
    max_backoff_seconds: 8
  todoist:
    timeout_seconds: 30
    retries: 2
    initial_backoff_seconds: 1
    max_backoff_seconds: 8
  google_calendar:
    timeout_seconds: 30
    retries: 2
    initial_backoff_seconds: 1
    max_backoff_seconds: 8
  telegram_poll_seconds: 30
  # Nur im experimentellen lokalen Modus (--ollama). Lokale Modelle antworten
  # deutlich langsamer; ohne Angabe gelten genau diese Werte.
  ollama:
    timeout_seconds: 600
    retries: 1
    initial_backoff_seconds: 2
    max_backoff_seconds: 10
logging:
  directory: logs
  console:
    enabled: true
    level: INFO
    format: text
  file:
    enabled: true
    level: INFO
    format: jsonl
    filename: application.jsonl
    max_bytes: 10000000
    backup_count: 5
    retention_days: 30
  modules:
    openrouter: INFO
  llm:
    enabled: true
    level: INFO
    format: jsonl
    filename: llm/requests.jsonl
    max_bytes: 10000000
    backup_count: 5
    retention_days: 30
    include_requests: true
    include_responses: true
  telegram:
    enabled: true
    level: INFO
    format: jsonl
    filename: telegram/messages.jsonl
    max_bytes: 10000000
    backup_count: 5
    retention_days: 30
