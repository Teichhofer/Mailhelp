# Ziel: eigene Demo-Site; DOMAIN ersetzen. Demo-Netz/IP muss zum Compose passen.
limit_req_zone $binary_remote_addr zone=mailhelp_demo_requests:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mailhelp_demo_clients:1m;
server {
    listen 80;
    server_name DOMAIN;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/mailhelp-acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name DOMAIN;
    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/mailhelp-demo-error.log crit;
    client_max_body_size 64k;
    client_body_timeout 10s;
    limit_req_status 429;
    limit_conn_status 429;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location / {
        limit_req zone=mailhelp_demo_requests burst=40 nodelay;
        limit_conn mailhelp_demo_clients 20;
        proxy_pass http://172.30.86.2:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
}
