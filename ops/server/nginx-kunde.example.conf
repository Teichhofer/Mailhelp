# Mailhelp 8.7: Kundeninstanz „kunde“ (Planung-8.7-Lernen.md §6).
# HTTPS-Site: /etc/nginx/sites-available/mailhelp-kunde-https, Link in sites-enabled.
# Die HTTP-Site mailhelp-kunde-http beantwortet nur ACME (Webroot /var/www/mailhelp-acme) und leitet um.
# Zugriffslogs aus, damit Anmelde- und OAuth-Querystrings nicht in nginx-Logs landen.
limit_req_zone $binary_remote_addr zone=mailhelp_kunde_requests:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=mailhelp_kunde_clients:1m;
server {
 listen 443 ssl;
 http2 on;
 server_name kunde.inboxstride.de;
 ssl_certificate /etc/letsencrypt/live/kunde.inboxstride.de/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/kunde.inboxstride.de/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 error_log /var/log/nginx/mailhelp-kunde-error.log crit;
 client_max_body_size 1m;
 client_body_timeout 15s;
 limit_req_status 429;
 limit_conn_status 429;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header X-Frame-Options DENY always;
 location / {
  limit_req zone=mailhelp_kunde_requests burst=40 nodelay;
  limit_conn mailhelp_kunde_clients 20;
  proxy_pass http://127.0.0.1:8766;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 3s;
  proxy_read_timeout 60s;
 }
}
