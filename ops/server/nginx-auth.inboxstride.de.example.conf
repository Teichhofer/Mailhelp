# Verifizierter Stand 19.11.2026 (Mailhelp 7.9.5); identisch mit der installierten Site.
# Zielpfad: /etc/nginx/sites-available/auth.inboxstride.de, Verknüpfung in sites-enabled.
# Zertifikat wie bei den übrigen Domains per Webroot mit dem certbot-Container (DNS-A-Eintrag vorhanden):
#   docker run --rm -v /etc/letsencrypt:/etc/letsencrypt -v /var/www/mailhelp-acme:/webroot \
#     certbot/certbot:v5.10.0 certonly --webroot -w /webroot -d auth.inboxstride.de
# Erneuerung: eigenes Skript /usr/local/sbin/renew-inboxstride-auth und /etc/cron.d/inboxstride-auth-cert-renew
# nach dem Muster von renew-inboxstride (renew --cert-name auth.inboxstride.de, nginx -t, reload).
# Öffentlich sind nur der Google-Callback und /health; alles andere beantwortet nginx mit 404.

limit_req_zone $binary_remote_addr zone=inboxstride_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name auth.inboxstride.de;
    location /.well-known/acme-challenge/ { root /var/www/mailhelp-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.inboxstride.de;

    ssl_certificate     /etc/letsencrypt/live/auth.inboxstride.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.inboxstride.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Callback-URLs tragen Code und State: nicht protokollieren.
    access_log off;
    client_max_body_size 8k;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /auth/google/callback {
        limit_req zone=inboxstride_auth burst=10 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8780;
    }

    location / { return 404; }
}
