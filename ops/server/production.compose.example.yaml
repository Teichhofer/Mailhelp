# Verifizierter Stand 24.11.2026, Mailhelp 8.5.3, Commit 241e23e.
# Zielpfad auf dem Host: /opt/mailhelp/compose.setup.yaml.
# Zugangsdaten liegen privat unter /opt/mailhelp/runtime/.env; das Instanzzertifikat für den
# zentralen Anmeldedienst unter /opt/mailhelp/runtime/hosted-auth/ (Eigentümer 65532, 0600).
services:
  mailhelp:
    build:
      context: /opt/mailhelp/releases/8.5.3-241e23e
    image: mailhelp-production:8.5.3-241e23e
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      MAILHELP_SETUP_HOST: 0.0.0.0
      MAILHELP_SETUP_ALLOWED_HOSTS: ${MAILHELP_SETUP_ALLOWED_HOSTS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./runtime:/config
    networks:
      - default
      # Interne mTLS-Schnittstelle des Anmeldedienstes (https://auth-intern:8443); die Demo nie.
      - inboxstride-auth
volumes:
  mailhelp-config:
networks:
  inboxstride-auth:
    external: true
