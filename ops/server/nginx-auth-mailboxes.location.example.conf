# 8.1, noch nicht produktiv: innerhalb des HTTPS-Servers der Auth-Site ergänzen.
# Übernimmt dessen access_log off, Zertifikat und Body-Limit.
location = /auth/microsoft/callback {
    limit_req zone=inboxstride_auth burst=10 nodelay;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8780;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
}
