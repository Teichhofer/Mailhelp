# Ziel: eigene Site unter sites-available, Link in sites-enabled.
# DOMAIN durch den freigeschalteten Instanzhost ersetzen; Zertifikat vorher bereitstellen.
# Aus dem am 20.11.2026 gelesenen Bestand abgeleitet; access_log off schützt Abschlussbelege.
server {
    listen 80;
    server_name DOMAIN;
    location ^~ /.well-known/acme-challenge/ { root /var/www/mailhelp-acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name DOMAIN;
    ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
