name: Weekly

# Checks too slow or too noisy for every push (Planung 2.1, T8).
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - run: python -m pip install pip-audit==2.9.0
      - name: Known vulnerabilities in the pinned dependencies
        run: python -m pip_audit --strict -r requirements.lock -r requirements-lint.lock
