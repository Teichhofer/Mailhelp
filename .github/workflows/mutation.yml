name: Mutation audit

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-mutation.lock
      - run: python -m pip install -r requirements.lock -r requirements-lint.lock -r requirements-mutation.lock
      - run: python -m pip install --no-deps -e .
      - name: Mutation score must reach 90 percent
        run: python -m devtools.check mutation
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutation-results
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/**/*.meta
