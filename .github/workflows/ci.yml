name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest --cov=mailhelp --cov-branch --cov-fail-under=100

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag mailhelp:ci .
      - name: Validate configuration in the built container
        env:
          IMAP_USERNAME: synthetic-user
          IMAP_PASSWORD: synthetic-password
          OPENROUTER_API_KEY: synthetic-openrouter-key
          TELEGRAM_BOT_TOKEN: synthetic-telegram-token
          TODOIST_TOKEN: synthetic-todoist-token
          TODOIST_CLIENT_ID: synthetic-todoist-client
          TODOIST_CLIENT_SECRET: synthetic-todoist-secret
          GOOGLE_OAUTH_CLIENT_ID: synthetic-google-client
          GOOGLE_OAUTH_CLIENT_SECRET: synthetic-google-secret
          GOOGLE_OAUTH_REFRESH_TOKEN: synthetic-google-refresh
        run: >-
          docker run --rm
          -e IMAP_USERNAME -e IMAP_PASSWORD -e OPENROUTER_API_KEY
          -e TELEGRAM_BOT_TOKEN -e TODOIST_TOKEN -e TODOIST_CLIENT_ID
          -e TODOIST_CLIENT_SECRET -e GOOGLE_OAUTH_CLIENT_ID
          -e GOOGLE_OAUTH_CLIENT_SECRET -e GOOGLE_OAUTH_REFRESH_TOKEN
          -v "$PWD/config.yaml:/config/config.yaml:ro"
          -v "$PWD/prompts.yaml:/config/prompts.yaml:ro"
          -v "$PWD/topics.yaml:/config/topics.yaml:ro"
          mailhelp:ci --check --config-directory /config
          --log-directory /tmp/mailhelp/logs
