name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install -r requirements.lock -r requirements-lint.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest --cov=mailhelp --cov-branch --cov-fail-under=100 --durations=20

  static-analysis:
    # Planung 2.1, A1: ruff and mypy are clean since 2.2.4; every finding fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install -r requirements.lock -r requirements-lint.lock
      - run: python -m pip install --no-deps -e .
      - name: ruff
        run: python -m ruff check --statistics
      - name: mypy
        if: always()
        run: python -m mypy

  ui-tests:
    # Browser tests of the web interface on desktop and iPhone viewports.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
      - run: python -m pip install -r requirements.lock playwright==1.62.0 axe-playwright-python==0.1.8
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest ui_tests --no-cov -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: .test-tmp/ui-screens

  package-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install -r requirements.lock hatchling==1.27.0
      - run: python -m hatchling build
      - name: Install the actual wheel, not an editable checkout
        shell: bash
        run: python -m pip install --no-deps dist/*.whl
      - name: Verify installed resources and curated source archive
        env:
          MAILHELP_INSTALLED_WHEEL: '1'
        run: python -m pytest tests/release/test_release_package.py -q --no-cov

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare synthetic configuration and production mount permissions
        run: |
          cp config.example.yaml config.yaml
          cp tests/fixtures/irrelevant-senders.json irrelevant-senders.json
          for name in IMAP_USERNAME IMAP_PASSWORD OPENROUTER_API_KEY TELEGRAM_BOT_TOKEN TODOIST_TOKEN TODOIST_CLIENT_ID TODOIST_CLIENT_SECRET GOOGLE_OAUTH_CLIENT_ID GOOGLE_OAUTH_CLIENT_SECRET GOOGLE_OAUTH_REFRESH_TOKEN; do
            printf '%s=synthetic-smoke-value\n' "$name" >> .env
          done
          mkdir -p data logs
          sudo chown 65532:65532 data logs
      - run: docker compose build
      - name: Validate configuration using production log mount
        run: docker compose run --rm --no-deps mailhelp --check --config-directory /config
      - name: Simulated service start with production mounts and no network
        run: docker compose -f compose.yaml -f compose.smoke.yaml run --rm --no-deps -e MAILHELP_SMOKE_STAGE=1 mailhelp
      - name: Restart in a fresh container and verify persisted checkpoints
        run: docker compose -f compose.yaml -f compose.smoke.yaml run --rm --no-deps -e MAILHELP_SMOKE_STAGE=2 mailhelp
      - name: Prepare replaceable learning configuration
        run: |
          mkdir -p learning-config
          cp config.yaml prompts.yaml topics.yaml irrelevant_topics.yaml irrelevant-senders.json learning-config/
          sudo chown -R 65532:65532 learning-config
      - name: Learn synthetic topics and sender with no network
        run: docker compose -f compose.learn.yaml -f compose.learn.smoke.yaml run --rm --no-deps -e MAILHELP_SMOKE_STAGE=1 mailhelp
      - name: Verify learned configuration in a fresh container
        run: docker compose -f compose.learn.yaml -f compose.learn.smoke.yaml run --rm --no-deps -e MAILHELP_SMOKE_STAGE=2 mailhelp
