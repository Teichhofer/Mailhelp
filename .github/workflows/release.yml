name: Release

on:
  push:
    tags: ['v1.*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - run: python -m pip install hatchling==1.27.0
      - name: Verify the tag matches both package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c "import os,tomllib; from pathlib import Path; v=tomllib.loads(Path('pyproject.toml').read_text())['project']['version']; assert os.environ['RELEASE_TAG']=='v'+v; assert '__version__ = '+repr(v).replace(chr(39),chr(34)) in Path('src/mailhelp/__init__.py').read_text()"
      - run: python -m hatchling build
      - name: Publish the verified wheel and source archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Mailhelp $RELEASE_TAG" --notes-file docs/Release-1.0.md
