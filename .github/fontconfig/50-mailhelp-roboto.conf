<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 8.7.11: the browser suite on Ubuntu renders with Roboto like Android phones. Without it system-ui and
     sans-serif fell back to the much wider DejaVu Sans; rows and tap targets then measured differently than on
     every real device (Windows, macOS, iOS, Android). -->
<fontconfig>
  <alias><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>Roboto</family></prefer></alias>
</fontconfig>
