[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mailhelp"
version = "4.5.0"
description = "Persönlicher, bestätigungspflichtiger E-Mail-Assistent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1", "pillow==12.2.0", "pydantic==2.11.7", "pypdf==6.20.0", "PyYAML==6.0.2", "tzdata==2026.4", "pywebpush==2.5.0", "openpyxl==3.1.5"]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-cov==6.2.1", "hypothesis==6.131.0", "time-machine==3.6.0", "pytest-xdist==3.8.0"]
mutation = ["mutmut==3.8.0; sys_platform == 'linux'"]
# Browser tests of the web interface (ui_tests/), using the installed Chrome.
ui = ["playwright==1.62.0", "axe-playwright-python==0.1.8"]
# Static checks (Planung 2.1, A1); every finding fails the CI since 2.2.4.
lint = ["ruff==0.12.12", "mypy==1.17.1", "types-PyYAML==6.0.12.20250809"]

[project.scripts]
mailhelp = "mailhelp.cli:main"
mailhelp-evaluate = "mailhelp.llm.evaluation:main"

[tool.pytest.ini_options]
addopts = "--cov=mailhelp --cov=devtools --cov-branch --cov-fail-under=100 --strict-markers"
# Planung 4.1, Schritt 9.2: fast development runs deselect these with
# pytest -m "not (slow or process or e2e)" --no-cov
markers = [
  "slow: takes more than one second on a development machine",
  "process: starts real child processes (ProcessHarness, hard kills, CLI scripts)",
  "e2e: complete flows with container or lifecycle context (tests/e2e)",
  "smoke: fast browser check before a push: python -m pytest ui_tests -m smoke --no-cov",
]
testpaths = ["tests"]
# The project root makes tests.fakes and tests.scenarios importable (Planung 4.1, 9.3).
pythonpath = ["."]
# Temporary test files live in .test-tmp; see tests/conftest.py.
cache_dir = ".test-tmp/pytest-cache"
tmp_path_retention_policy = "failed"

[tool.mutmut]
# Planung 4.1, Schritt 9.6: sampled mutation testing of the safety-critical core.
# mutmut needs fork and runs on Linux, for example in WSL: python -m mutmut run
source_paths = ["src"]
# Count tests that exercise a core function directly or through a short core call chain.
# The full suite still verifies the complete application; no source line is excluded here.
max_stack_depth = 4
only_mutate = ["src/mailhelp/domain/*", "src/mailhelp/storage.py", "src/mailhelp/external/confirmed.py"]
# One-line stubs (protocols, overloads) have no behaviour; mutated, a protocol gains
# attributes that break its isinstance checks.
do_not_mutate_patterns = ['^\s+def .*: \.\.\.$']
# Child processes and containers would not see the mutant; the full suite runs them.
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider", "-m", "not (process or e2e)"]
pytest_add_cli_args_test_selection = [
  "tests/unit/test_mutation_invariants.py", "tests/unit/test_core.py",
  "tests/unit/test_validation_boundaries.py", "tests/unit/test_v13_domain.py",
  "tests/unit/test_mail_timestamps.py",
  "tests/services/test_already_done.py", "tests/services/test_v42_responsiveness.py",
  "tests/unit/test_lock_metrics.py",
  "tests/unit/test_v43_counts.py", "tests/unit/test_v43_series_models.py",
  "tests/services/test_v43_series.py", "tests/services/test_v43_series_recovery.py",
]
# Project files that tests read relative to the repository root.
also_copy = [
  "ui_tests", "devtools", "docs", "website", ".github", "quality-reports", "AGENTS.md", "CHANGELOG.md", "README.md",
  "Mailhelp-Projektspezifikation.md", "DATENSCHUTZ.md", "NUTZUNGSBEDINGUNGEN.md", "LICENSE", "Dockerfile",
  ".dockerignore", ".env.example", ".gitignore", "compose.yaml", "compose.setup.yaml", "compose.smoke.yaml",
  "compose.learn.yaml", "compose.learn.smoke.yaml", "compose.decision-test.yaml", "config.example.yaml",
  "prompts.yaml", "decisions_prompts.yaml", "laya_prompts.yaml", "topics.yaml", "irrelevant_topics.yaml", "requirements-mutation.lock",
  "irrelevant-senders.example.json", "requirements.lock", "requirements-lint.lock",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "ui_tests", "devtools"]

[tool.ruff.lint]
# Pyflakes, isort, pyupgrade, bugbear, the line length and (Planung 3.3) the McCabe complexity.
select = ["F", "I", "UP", "B", "E501", "C90"]
# UP038 is deprecated in ruff itself (X | Y in isinstance is slower than a tuple).
ignore = ["UP038"]

[tool.ruff.lint.mccabe]
# No function above 15 branches since 3.2.4; hotspots were split into named steps.
max-complexity = 15

[tool.ruff.lint.isort]
known-first-party = ["mailhelp", "tests", "devtools"]

[tool.ruff.lint.per-file-ignores]
"src/mailhelp/web/setting_help.py" = ["E501"]
"src/mailhelp/telegram/_core.py" = ["F401", "F403"]
"src/mailhelp/telegram/__init__.py" = ["F401"]
"src/mailhelp/integrations.py" = ["F401"]
# Compatibility facades re-export the domain contexts.
"src/mailhelp/models.py" = ["F401", "F403"]
"src/mailhelp/domain/__init__.py" = ["F401", "F403"]
"tests/*" = ["F811", "E501", "F401", "F403"]

[tool.mypy]
python_version = "3.12"
# pydantic validates and converts constructor arguments at runtime (str to enum, URL ...).
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["mailhelp", "devtools"]
warn_unused_configs = true
warn_redundant_casts = true
# Planung 3.3: bodies of untyped functions are checked as well (0 findings since 3.2.3).
check_untyped_defs = true

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["pywebpush.*", "py_vapid.*", "http_ece.*", "pypdf.*", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Strict core (Planung 2.1, A1); extended step by step.
# Planung 3.3, Phase 5: persistence, normalisation, merge, precheck, evaluation, configuration
# and the run loop with its service coordination.
module = ["mailhelp.domain.*", "mailhelp.external.contracts", "mailhelp.notifications.drafts", "mailhelp.notifications.webpush",
          "mailhelp.notifications.briefing", "mailhelp.processing.attachments",
          "mailhelp.persistence.*", "mailhelp.proposals.action_normalization", "mailhelp.proposals.proposal_merge",
          "mailhelp.proposals.precheck", "mailhelp.german_dates", "mailhelp.temporal_answers",
          "mailhelp.llm.evaluation", "mailhelp.configuration", "mailhelp.config.*",
          "mailhelp.mailbox.mailbox_run", "mailhelp.runtime.application", "mailhelp.runtime.service_coordinator",
          "mailhelp.runtime.lifecycle", "mailhelp.proposals.profile_usage", "mailhelp.mailbox.iserv", "mailhelp.telegram.*", "mailhelp.review.*",
          "mailhelp.web.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.coverage.run]
branch = true
data_file = ".test-tmp/.coverage"
source = ["mailhelp", "devtools"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/README.md", "/LICENSE", "/pyproject.toml", "/requirements.lock", "/requirements-lint.lock",
  "/config.example.yaml", "/.env.example", "/prompts.yaml", "/decisions_prompts.yaml",
  "/topics.yaml", "/irrelevant_topics.yaml", "/irrelevant-senders.example.json",
  "/compose.yaml", "/compose.setup.yaml", "/Dockerfile", "/.dockerignore", "/CHANGELOG.md", "/docs/Release-1.0.md",
  "/docs/Release-1.1.md", "/docs/Release-1.2.md",
  "/docs/Release-1.6.md", "/docs/Architektur-1.6.md", "/docs/Planung-1.6.md",
  "/docs/Web-Einstellungen.md",
  "/docs/Release-2.0.md", "/docs/Planung-2.0.md", "/docs/Konzept-2.0-Redesign-und-Web-Push.md",
  "/docs/Release-2.1.md", "/docs/Architektur-2.1.md", "/docs/Planung-2.1.md",
  "/docs/Release-2.2.md", "/docs/Planung-2.2.md",
  "/docs/Planung-2.4.md", "/docs/Architektur-2.4.md", "/docs/Release-2.4.md",
  "/docs/Release-3.0.md", "/docs/Planung-3.0.md", "/docs/Planung-3.1.md", "/docs/Planung-3.2.md",
  "/docs/Planung-3.3.md", "/docs/Planung-3.4.md", "/docs/Release-3.1.md",
  "/docs/Release-3.2.md",
  "/docs/Release-3.3.md", "/docs/Release-3.4.md", "/docs/Release-3.5.md", "/docs/Planung-3.5.md",
  "/docs/Planung-4.0.md",
  "/docs/Planung-4.1.md", "/docs/Qualitaet-4.1.md", "/requirements-mutation.lock",
  "/docs/Planung-4.2.md", "/docs/Release-4.2.md",
  "/docs/Planung-4.3.md", "/docs/Release-4.3.md",
  "/docs/Planung-4.4.md", "/docs/Release-4.4.md", "/docs/Planung-4.5.md",
  "/docs/Planung-3.6.md", "/docs/Planung-3.7.md", "/docs/Zustandsregeln-3.6.md",
  "/docs/Release-3.7.md", "/docs/Google-OAuth-Playground.md", "/docs/Einrichtung-und-Qualitaetspruefung.md",
  "/docs/Planung-3.8.md", "/docs/Release-3.8.md",
  "/docs/Entkopplung-Web-und-Abruf.md", "/docs/Paketstruktur.md", "/docs/Release-3.6.md",
  "/Mailhelp-Projektspezifikation.md", "/DATENSCHUTZ.md", "/NUTZUNGSBEDINGUNGEN.md",
]

