[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mailhelp"
version = "0.1.0"
description = "Persönlicher, bestätigungspflichtiger E-Mail-Assistent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1", "pydantic==2.11.7", "PyYAML==6.0.2"]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-cov==6.2.1"]

[project.scripts]
mailhelp = "mailhelp.cli:main"

[tool.pytest.ini_options]
addopts = "--cov=mailhelp --cov-branch --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mailhelp"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

